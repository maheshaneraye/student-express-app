name: Node.js CI/CD Pipeline

on:
  push:
    branches: [ "main", "staging", "develop" ]
  pull_request:
    branches: [ "main", "staging" ]

env:
  IMAGE_NAME: student-express-app

jobs:
  test-build-scan-deploy:
    name: Test, Build, Scan & Request Deployment
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout Repository
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # Step 2: Set up Node.js runtime
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      # Step 3: Install dependencies
      - name: Install Dependencies
        run: npm ci

      # Step 4: Run unit & integration tests
      - name: Run Jest Test Suite
        run: npm test

      # Step 5: Configure Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Step 6: Log in to Docker Registry
      - name: Log in to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Step 7: Build Docker image for security scanning
      - name: Build Docker Image for Scanning
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: ${{ secrets.DOCKERHUB_USERNAME || 'student' }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      # Step 8: Run Trivy Vulnerability Scanner
      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "${{ secrets.DOCKERHUB_USERNAME || 'student' }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          format: 'json'
          output: 'trivy-report.json'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH,MEDIUM,LOW'

      # Step 9: Push Docker Image to Registry
      - name: Push Docker Image to Docker Hub
        if: github.event_name == 'push'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME || 'student' }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME || 'student' }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}

      # Step 10: Trigger Centralized CI/CD Manager API (The Webhook Bridge)
      - name: Send Deployment Request to College Cloud CI/CD Manager
        if: github.event_name == 'push'
        env:
          COLLEGE_CD_URL: ${{ secrets.COLLEGE_CD_URL }}
          COLLEGE_CD_TOKEN: ${{ secrets.COLLEGE_CD_TOKEN }}
          COLLEGE_PROJECT_ID: ${{ vars.COLLEGE_PROJECT_ID }}
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          BRANCH_NAME: ${{ github.ref_name }}
          DOCKER_IMAGE: ${{ secrets.DOCKERHUB_USERNAME || 'student' }}/${{ env.IMAGE_NAME }}
        run: |
          echo "Validating College Cloud CI/CD Manager configuration..."

          if [ -z "$COLLEGE_CD_URL" ]; then
            echo "::error::Missing required secret: COLLEGE_CD_URL"
            exit 1
          fi

          if [ -z "$COLLEGE_CD_TOKEN" ]; then
            echo "::error::Missing required secret: COLLEGE_CD_TOKEN"
            exit 1
          fi

          if [ -z "$COLLEGE_PROJECT_ID" ]; then
            echo "::error::Missing required repository variable: COLLEGE_PROJECT_ID"
            exit 1
          fi

          # Detect target environment based on branch (main -> PRODUCTION, staging -> STAGING)
          if [ "$BRANCH_NAME" = "main" ]; then
            TARGET_ENV="PRODUCTION"
          else
            TARGET_ENV="STAGING"
          fi

          # Safe fallback for empty commit message
          MSG="${COMMIT_MSG:-Automated commit via CI}"

          # Extract vulnerability counts from machine-readable Trivy JSON report
          echo "Extracting Trivy vulnerability scan results..."
          if [ ! -f trivy-report.json ]; then
            echo "::error::trivy-report.json not found! Security scan is missing or failed."
            exit 1
          fi

          CRITICAL_COUNT=$(jq '[.Results[]?.Vulnerabilities[]? | select((.Severity // "") | ascii_upcase == "CRITICAL")] | length' trivy-report.json)
          HIGH_COUNT=$(jq '[.Results[]?.Vulnerabilities[]? | select((.Severity // "") | ascii_upcase == "HIGH")] | length' trivy-report.json)
          MEDIUM_COUNT=$(jq '[.Results[]?.Vulnerabilities[]? | select((.Severity // "") | ascii_upcase == "MEDIUM")] | length' trivy-report.json)
          LOW_COUNT=$(jq '[.Results[]?.Vulnerabilities[]? | select((.Severity // "") | ascii_upcase == "LOW")] | length' trivy-report.json)

          if [ -z "$CRITICAL_COUNT" ] || [ -z "$HIGH_COUNT" ] || [ -z "$MEDIUM_COUNT" ] || [ -z "$LOW_COUNT" ]; then
            echo "::error::Failed to extract vulnerability counts from trivy-report.json."
            exit 1
          fi

          # Derive Trivy status based on scan results (Critical vulnerabilities block deployment)
          if [ "$CRITICAL_COUNT" -gt 0 ]; then
            TRIVY_STATUS="FAILED"
          else
            TRIVY_STATUS="PASSED"
          fi

          echo "Trivy Scan Results:"
          echo "  Critical: $CRITICAL_COUNT"
          echo "  High:     $HIGH_COUNT"
          echo "  Medium:   $MEDIUM_COUNT"
          echo "  Low:      $LOW_COUNT"
          echo "  Status:   $TRIVY_STATUS"

          # Construct JSON safely using jq to prevent injection or formatting breaks from quotes/newlines
          PAYLOAD=$(jq -n \
            --argjson projectId "$COLLEGE_PROJECT_ID" \
            --arg commitSha "$COMMIT_SHA" \
            --arg commitMessage "$MSG" \
            --arg branch "$BRANCH_NAME" \
            --arg environment "$TARGET_ENV" \
            --arg image "$DOCKER_IMAGE" \
            --arg imageTag "$COMMIT_SHA" \
            --arg trivyStatus "$TRIVY_STATUS" \
            --argjson critical "$CRITICAL_COUNT" \
            --argjson high "$HIGH_COUNT" \
            --argjson medium "$MEDIUM_COUNT" \
            --argjson low "$LOW_COUNT" \
            '{
              projectId: $projectId,
              commitSha: $commitSha,
              commitMessage: $commitMessage,
              branch: $branch,
              environment: $environment,
              image: $image,
              imageTag: $imageTag,
              trivyStatus: $trivyStatus,
              trivySummary: {
                critical: $critical,
                high: $high,
                medium: $medium,
                low: $low
              }
            }')

          echo "Dispatching deployment request to $COLLEGE_CD_URL/api/deployments/request..."

          HTTP_RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "$COLLEGE_CD_URL/api/deployments/request" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $COLLEGE_CD_TOKEN" \
            -d "$PAYLOAD")

          HTTP_BODY=$(echo "$HTTP_RESPONSE" | sed '$d')
          HTTP_STATUS=$(echo "$HTTP_RESPONSE" | tail -n 1)

          echo "Response HTTP Status: $HTTP_STATUS"
          echo "Response Body: $HTTP_BODY"

          if [ "$HTTP_STATUS" -ne 202 ] && [ "$HTTP_STATUS" -ne 200 ]; then
            echo "::error::Deployment request rejected by College Cloud CI/CD Manager (HTTP $HTTP_STATUS)"
            exit 1
          fi

          echo "Deployment request successfully accepted by College Cloud CI/CD Manager!"
